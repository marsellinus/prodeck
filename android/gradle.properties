# AGP 8.9.1 does not support JDK 26; the toolchain on this machine is JDK 21.
# Pinned here so `./gradlew` picks the right JVM without relying on JAVA_HOME.
org.gradle.java.home=C:/Program Files/Java/jdk-21.0.11

org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# compileSdk 36 is newer than the maximum AGP 8.9.1 was built against. The
# platform is installed locally and the build works; silence the advisory.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
