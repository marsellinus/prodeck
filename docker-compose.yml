# =============================================================================
# DOCUMENTATION, DEVELOPER TOOLING, AND AN OPTIONAL AGENT CONTAINER.
#
# The MobileDeck host agent NEVER requires Docker. It is one static binary and
# running it natively is the supported path:
#
#     cd host && go run ./cmd/mobiledeck run        # or ./mobiledeck run
#
# A container cannot drive the host's keyboard, mouse, or X11 session without
# --privileged and socket mounts, which is worse than not using Docker at all
# (ADR-0009, docs/SECURITY.md §4). The `agent` service below is therefore only
# useful for the subset of actions that do not touch the desktop session; see
# docs/DEPLOYMENT.md for the exact split.
# =============================================================================

services:
  # The agent in a container. Optional; the native binary is the supported
  # deployment for input control.
  #
  #   docker compose up -d agent
  #
  # network_mode: host is required, not a convenience. Two things break on the
  # default bridge network:
  #   * mDNS discovery: the phone's multicast browse never reaches the
  #     container, so the host does not show up in the client's list;
  #   * LAN reachability: the port is advertised over mDNS as the host's own
  #     port, but a bridged container's port lives on the docker0 address, so
  #     the advertised address would not answer.
  # With host networking the agent binds the host's port 8765 directly and
  # advertises the host's real address. This makes the service Linux-only: on
  # Docker Desktop for Windows/macOS "host" networking does not mean the host's
  # LAN interface, and the agent should be run natively there instead.
  #
  # The config directory is bind-mounted so profiles, devices.json, audit.jsonl
  # and the TLS material survive a container rebuild. ./data is gitignored;
  # devices.json and audit.jsonl are secrets (docs/SECURITY.md §6).
  agent:
    build:
      context: ./host
      dockerfile: Dockerfile
    image: mobiledeck/agent:dev
    container_name: mobiledeck-agent
    network_mode: host
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Static HTTP server for docs/. Read-only mount: this service must never be
  # able to write to the repository.
  #
  #   docker compose up docs
  #   -> http://localhost:8080/
  docs:
    image: nginx:1.27-alpine
    container_name: mobiledeck-docs
    ports:
      - "8080:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
    restart: unless-stopped

  # Reproducible build environment: Go 1.26 for the host, a JDK for the Android
  # client's Gradle build. It is a shell, not a service; the repository is
  # mounted at /work and nothing is built automatically.
  #
  #   docker compose run --rm tools bash
  #   (inside) cd /work/host && go build ./... && go test ./...
  #   (inside) cd /work/android && ./gradlew assembleDebug
  #
  # The JDK is installed on first start from Debian's archive because the
  # upstream golang image ships no Java. This costs one apt download per fresh
  # container; pin the version below if you need byte-reproducible toolchains.
  tools:
    image: golang:1.26-bookworm
    container_name: mobiledeck-tools
    working_dir: /work
    volumes:
      - .:/work
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
      - gradle-cache:/root/.gradle
    environment:
      # The Android build resolves its SDK from local.properties, which is
      # gitignored and machine-local. Mount it or pass ANDROID_HOME explicitly;
      # this container is not an Android SDK image.
      CGO_ENABLED: "0"
      GOFLAGS: "-trimpath"
    command: >
      bash -lc "apt-get update
      && apt-get install -y --no-install-recommends openjdk-21-jdk-headless
      && exec sleep infinity"

volumes:
  go-build-cache:
  go-mod-cache:
  gradle-cache:
